<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PetoClaro — Panel del cultivo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--bg:#0d1410;--card:#152019;--line:#24352a;--txt:#e6efe8;--mut:#8aa092;--ok:#4ade80;--warn:#facc15;--bad:#f87171}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:18px}main{max-width:1100px;margin:auto;padding:24px 20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:inherit;text-align:left;font:inherit}
  .card.on{outline:2px solid var(--c)}.card small{color:var(--mut);display:flex;justify-content:space-between}
  .val{font:600 28px ui-monospace,monospace;margin-top:10px}.val span{font-size:13px;color:var(--mut)}
  .ok .val{color:var(--ok)}.warn .val{color:var(--warn)}.bad .val{color:var(--bad)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:20px}
  .hint,footer{color:var(--mut);font-size:12px}button.r{background:none;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;cursor:pointer}
  a{color:var(--ok)}
  .ctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:12px 0}
  .ctl:first-of-type{border-top:0}.ctl b{display:block}.ctl .hint{font-family:ui-monospace,monospace}
  .btns{display:flex;gap:8px;flex-wrap:wrap}.btns button,.sched button{border:1px solid var(--line);background:none;color:var(--txt);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
  .btns .on{background:var(--ok);color:#0d1410;border-color:var(--ok)}.btns .off{background:var(--bad);color:#0d1410;border-color:var(--bad)}
  .sched{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;border-top:1px solid var(--line);padding-top:12px}
  .sched label{font-size:12px;color:var(--mut)}.sched input{display:block;margin-top:4px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px}
  .sched .save{background:var(--ok);color:#0d1410;border-color:var(--ok)}
  #msg{font-size:13px;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<header><h1>PetoClaro</h1><div><span id="ts" class="hint"></span> <button class="r" onclick="load()">Actualizar</button></div></header>
<main>
  <p class="hint">Tocá las tarjetas para sumar o quitar sensores del gráfico.</p>
  <div class="grid" id="cards"></div>
  <div class="panel"><div style="height:320px"><canvas id="chart"></canvas></div></div>
  <div class="panel">
    <h2 style="margin:0 0 8px;font-size:16px">Control remoto</h2>
    <div class="ctl"><div><b>Extractor</b><span class="hint">relé 1</span></div><div class="btns"><button class="on" onclick="cmd(['R1_ON'])">Encender</button><button class="off" onclick="cmd(['R1_OFF'])">Apagar</button><button onclick="cmd(['R1_AUTO'])">Automático</button></div></div>
    <div class="ctl"><div><b>Luz</b><span class="hint">relé 3</span></div><div class="btns"><button class="on" onclick="cmd(['R3_ON'])">Encender</button><button class="off" onclick="cmd(['R3_OFF'])">Apagar</button><button onclick="cmd(['R3_AUTO'])">Automático</button></div></div>
    <div class="sched"><div style="margin-right:auto"><b>Horario de la luz</b><div class="hint" id="last">Sin horario guardado en este navegador</div></div>
      <label>Enciende<input type="time" id="hon" value="06:00"></label>
      <label>Apaga<input type="time" id="hoff" value="00:00"></label>
      <button class="save" onclick="saveSched()">Guardar horario</button></div>
    <div id="msg" class="hint"></div>
  </div>
  <footer>Datos de ThingSpeak cada 10 min · se actualiza solo cada minuto</footer>
</main>
<script>
// Clave de SOLO LECTURA (segura de publicar). Nunca pongas acá la clave de TalkBack:
// los comandos se mandan al servidor del panel, que guarda la clave.
const API = "https://pixel-perfect-showcase-5714.lovable.app/api/public/command";
const CHANNEL = 3411808, READ_KEY = "ING0ZIN3WLD2C52M";
const S = [
  {f:"field1",l:"Temp. aire",u:"°C",s:"DHT22",c:"#4ade80",ok:v=>v>=25&&v<29,w:v=>v>=23&&v<30},
  {f:"field2",l:"Hum. aire",u:"%",s:"DHT22",c:"#60a5fa",ok:v=>v>=40&&v<=70,w:v=>v>=30&&v<=80},
  {f:"field4",l:"DPV",u:"kPa",s:"calculado",c:"#facc15",ok:v=>v>=0.7&&v<=1.2,w:v=>v>=0.5&&v<=1.6},
  {f:"field5",l:"T. suelo 20 cm",u:"°C",s:"DS18B20",c:"#fb923c",ok:v=>v>=20&&v<=22.9,w:v=>v>=18&&v<26},
  {f:"field6",l:"T. suelo 40 cm",u:"°C",s:"DS18B20",c:"#f87171",ok:v=>v>=20&&v<=22.9,w:v=>v>=18&&v<26},
  {f:"field7",l:"Hum. suelo 20 cm",u:"%",s:"FC-28",c:"#e879f9",ok:v=>v>=50&&v<=80,w:v=>v>=30&&v<=85},
  {f:"field8",l:"Hum. suelo 40 cm",u:"%",s:"FC-28",c:"#22d3ee",ok:v=>v>=50&&v<=80,w:v=>v>=30&&v<=85},
];
let feeds = [], sel = new Set(["field1"]), chart;
const num = x => { const n = parseFloat(x); return Number.isFinite(n) ? n : null; };

function render(){
  const last = feeds[feeds.length-1] || {};
  document.getElementById("cards").innerHTML = S.map(s=>{
    const v = num(last[s.f]); const st = v==null?"":s.ok(v)?"ok":s.w(v)?"warn":"bad";
    return `<button class="card ${st} ${sel.has(s.f)?"on":""}" style="--c:${s.c}" onclick="tog('${s.f}')">
      <small><span>● ${s.l}</span><span>${s.s}</span></small>
      <div class="val">${v==null?"—":v.toFixed(s.u==="kPa"?2:1)}<span> ${s.u}</span></div></button>`;
  }).join("");
  const act = S.filter(s=>sel.has(s.f)), units = [...new Set(act.map(s=>s.u))];
  const scales = {x:{ticks:{color:"#8aa092",maxTicksLimit:8},grid:{color:"#24352a"}}};
  units.forEach((u,i)=>scales[u]={position:i%2?"right":"left",display:i<2,ticks:{color:"#8aa092"},grid:{color:i?"transparent":"#24352a"},title:{display:true,text:u,color:"#8aa092"}});
  const data = {
    labels: feeds.map(f=>new Date(f.created_at).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})),
    datasets: act.map(s=>({label:`${s.l} (${s.u})`,data:feeds.map(f=>num(f[s.f])),borderColor:s.c,backgroundColor:s.c,yAxisID:s.u,pointRadius:0,borderWidth:2,tension:.3,spanGaps:true}))
  };
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"),{type:"line",data,options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},scales,plugins:{legend:{labels:{color:"#e6efe8"}}}}});
}
async function cmd(commands){
  let ok=false; const m = document.getElementById("msg"); m.textContent = "Enviando…";
  try{
    const r = await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({commands})});
    const j = await r.json(); ok = !!j.ok;
    m.textContent = j.ok ? commands.join(", ")+" en cola · el Arduino lo aplica en ~30 s" : "Error: "+(j.error||r.status);
  }catch(e){ m.textContent = "Error de conexión con el panel"; }
  return ok;
}
function showSched(h){ document.getElementById("last").textContent = "Último horario configurado: "+h.on+" a "+h.off; }
async function saveSched(){
  const on = document.getElementById("hon").value, off = document.getElementById("hoff").value;
  if (await cmd(["R3_HON_"+on.replace(":","_"),"R3_HOFF_"+off.replace(":","_"),"R3_AUTO"])){
    localStorage.setItem("pc-horario", JSON.stringify({on,off})); showSched({on,off});
  }
}
try{ const h = JSON.parse(localStorage.getItem("pc-horario")||"null");
  if (h && h.on && h.off){ document.getElementById("hon").value=h.on; document.getElementById("hoff").value=h.off; showSched(h); } }catch(e){}
function tog(f){ if(sel.has(f)){ if(sel.size>1) sel.delete(f); } else sel.add(f); render(); }
async function load(){
  try{
    const r = await fetch(`https://api.thingspeak.com/channels/${CHANNEL}/feeds.json?api_key=${READ_KEY}&results=144`);
    feeds = (await r.json()).feeds || [];
    const l = feeds[feeds.length-1];
    document.getElementById("ts").textContent = l ? "última lectura " + new Date(l.created_at).toLocaleString("es-AR") : "sin datos";
    render();
  }catch(e){ document.getElementById("ts").textContent = "error al leer ThingSpeak"; }
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
